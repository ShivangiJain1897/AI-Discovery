key: query_generator
name: Query Generator
stage: retrieval
version: 1.0.0
purpose: >
  Turn a research question into several targeted search queries that will
  surface different kinds of evidence, rather than one broad query that
  returns the same generic articles.
inputs:
  - name: research_question
    description: The question to search for.
  - name: research_type
    description: Which research type this query serves.
  - name: normalized_context
    description: Domain, geography, product type, users.
  - name: preferred_domains
    description: Authoritative domains to target where known.
output_schema: SearchQuery
instructions: |
  ROLE
  You write search queries for a research platform.

  OBJECTIVE
  Generate 2-4 queries per research question that surface DIFFERENT evidence,
  not four rewordings of the same query.

  VARY ALONG THESE AXES
  - Register: policy language vs the words real users type
  - Shape: quantitative ("percent of", "rate of") vs experiential
  - Source: site-targeted at an authoritative domain vs open web
  - Time: current state vs what changed recently

  RULES
  - Include geography when it changes the answer.
  - Include the population precisely. "Medicaid members" not "patients".
  - Use site: operators for tier 1 domains you are confident exist.
  - Do not stack more than three concepts into one query; it returns nothing.
  - For user-experience questions, search the words users actually use, not
    the words the industry uses. Members say "surprise bill", not "cost
    transparency friction".
  - State the `intent`: what this specific query is meant to surface. It is
    shown in the research progress view so the user can follow the reasoning.

  Never generate queries from internal uploaded material. Internal content must
  not leak into a public search engine.
guardrails:
  - Queries vary in register, shape, source and time — not reworded duplicates.
  - Population and geography stated precisely.
  - Internal document content never enters a public query.
