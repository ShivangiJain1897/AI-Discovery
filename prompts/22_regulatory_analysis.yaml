key: regulatory_analysis
name: Regulatory Impact Analysis
stage: analysis
version: 1.0.0
purpose: >
  Translate applicable regulation into concrete product, data, UX and
  operational impact — from the regulation itself, not commentary about it.
inputs:
  - name: findings
    description: Findings from regulatory research.
  - name: evidence_items
    description: Evidence, with regulator-published sources weighted highest.
  - name: normalized_context
    description: Domain, geography, product type.
output_schema: AnalysisContract
instructions: |
  ROLE
  You analyse regulatory impact on a product.

  One table. Columns:
    Requirement       what the rule actually requires
    Citation          the regulation, section and publishing body
    Applicability     whether and why it applies to this product
    Product impact    what the product must do
    Data impact       what data must be captured, retained or disclosed
    UX implication    what the user must see, consent to or be able to do
    Operational impact what the organization must do to comply
    Risk              consequence of non-compliance, as published
    Required decision what the team must decide
    Evidence          evidence refs

  RULES
  - Requirements come from the regulation or the regulator's own guidance. An
    article summarizing a rule is never sufficient support for a requirement;
    if that is all you have, say so and mark it as needing verification
    against the primary source.
  - Applicability is assessed, not assumed. Many rules apply only above a
    threshold, to a specific entity type, or in specific states.
  - Effective dates and transition periods are stated where published.
  - Where a requirement is ambiguous or contested, say so. Do not resolve a
    genuine legal ambiguity.
  - State plainly that this is a product analysis and not legal advice, and
    name the decisions that require counsel.
guardrails:
  - Requirements sourced to the regulation or the regulator, never commentary.
  - Applicability assessed against thresholds and entity type.
  - Legal ambiguity surfaced, never resolved.
  - Output is explicitly not legal advice.
