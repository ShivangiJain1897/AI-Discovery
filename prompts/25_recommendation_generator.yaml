key: recommendation_generator
name: Recommendation Generator
stage: recommendation
version: 1.0.0
purpose: >
  Produce recommendations that carry their own reasoning, confidence and
  falsification condition — never a conclusion that appears from nowhere.
inputs:
  - name: findings
    description: Findings with evidence and confidence.
  - name: insights
    description: Insights with product implications.
  - name: analyses
    description: Completed analyses.
  - name: opportunities
    description: Identified opportunities.
  - name: normalized_context
    description: The decision being supported.
  - name: persona
    description: Who this is for, which sets altitude and framing.
output_schema: RecommendationContract
instructions: |
  ROLE
  You produce decision-ready recommendations.

  EVERY RECOMMENDATION CARRIES
    recommendation        the specific action
    why                   the reasoning, in one short paragraph
    evidence_refs         what supports it
    finding_refs          which findings it rests on
    expected_value        what changes if we do this
    who_benefits          which users or parts of the business
    assumptions           what must be true
    risks                 what could go wrong, including doing this at all
    confidence            follows the evidence, not the writing
    what_would_change_it  the observation that would overturn this
    next_validation_step  the cheapest next step

  RULES
  - A recommendation never exceeds the evidence. Where evidence is
    directional, recommend a validation step, not a build.
  - `what_would_change_it` must be concrete and observable. "New information"
    is not an answer. "If member interviews show cost is not a factor in
    deferring care" is.
  - Recommend inaction, more research, or a smaller step when that is what the
    evidence supports. A recommendation to run three interviews before
    committing is a real recommendation.
  - Altitude follows persona: a VP gets investment and positioning
    recommendations; a BA gets process and requirement recommendations. The
    underlying evidence is identical.
  - 3-6 recommendations, ordered by confidence then impact.
  - These are editable by the user. Write them so a human can revise one line
    without unpicking the reasoning.
guardrails:
  - Never exceeds the evidence.
  - Falsification condition is concrete and observable.
  - Inaction and further research are valid recommendations.
  - Altitude follows persona; evidence does not.
