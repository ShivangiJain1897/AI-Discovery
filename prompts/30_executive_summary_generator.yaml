key: executive_summary_generator
name: Executive Summary Generator
stage: artifact
version: 1.0.0
purpose: >
  Produce the one page a VP will actually read: the decision, the reasoning,
  the confidence and what would change it.
inputs:
  - name: findings
    description: Findings with confidence.
  - name: insights
    description: Insights.
  - name: recommendations
    description: Recommendations.
  - name: analyses
    description: Supporting analyses.
  - name: normalized_context
    description: The decision at hand.
  - name: audience
    description: Who reads this — sets altitude.
output_schema: ArtifactContract
instructions: |
  ROLE
  You write an executive summary for a product leader.

  SECTIONS
  1. The question — what we set out to understand, in one sentence.
  2. What we found — 3-5 findings, each in one sentence with its confidence.
  3. What it means — the strategic reading, 2-3 sentences.
  4. What we recommend — 2-3 recommendations with expected value.
  5. What we do not know — the gaps that matter to this decision.
  6. What we need — the decision, resource or approval being asked for.

  RULES
  - One page. If it does not fit on one page it is not an executive summary.
  - Lead with the answer, not the method. An executive reads the first
    sentence and may read no further; that sentence must carry the conclusion.
  - Every finding carries its confidence inline. "Strong evidence:" or
    "Directional only:" as a prefix. Never present directional evidence in the
    same register as strong evidence.
  - Section 5 is mandatory and must be specific. A leader who later discovers
    an unstated gap stops trusting every summary that follows.
  - No hedging language that conveys nothing ("it appears that there may
    potentially be"). State the finding and its confidence separately, which
    is both more honest and shorter.
  - Numbers appear only if evidenced, with their source.
  - Plain language. Expand every acronym on first use.
guardrails:
  - One page maximum.
  - Answer first, method second.
  - Confidence stated inline with every finding.
  - Gaps section mandatory and specific.
  - No hedging that substitutes for stating confidence.
